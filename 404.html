<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>not found</title>
  <meta name="description" content="404 — nothing here" />

  <link rel="icon" href="/img/orb.png" type="image/png" />
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
  <meta name="theme-color" content="#000000" />

  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    #notfound {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
      perspective: 1600px;
    }

    /* self-contained: the home page's spin keyframe is gone as of v4 */
    .nf-code {
      margin: 0;
      font-family: var(--font);
      font-size: clamp(6rem, 22vw, 16rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      color: var(--fg);
      animation: nf-spin 3s linear infinite;
      will-change: transform;
    }

    @keyframes nf-spin {
      from { transform: rotateY(0deg);   }
      to   { transform: rotateY(360deg); }
    }

    .nf-message {
      margin: 0;
      font-family: var(--font);
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: lowercase;
      color: var(--fg-muted);
    }

    .nf-home {
      font-size: 1.05rem;
      padding: 0.6rem 1.4rem;
      margin-top: 0.8rem;
    }

    body.tab-hidden .nf-code { animation-play-state: paused; }

    @media (prefers-reduced-motion: reduce) {
      .nf-code { animation: none; }
    }
  </style>
</head>
<body>
  <div id="notfound">
    <pre class="nf-code">404</pre>
    <p class="nf-message">nothing here</p>
    <a class="btn enter nf-home" href="/">back home</a>
  </div>

  <script src="/js/ui-sound.js"></script>

  <script>
    document.addEventListener('visibilitychange', () => {
      document.body.classList.toggle('tab-hidden', document.hidden);
    });
  </script>
</body>
</html>
